# QA-024 — the phone's golden path, as a stranger walks it on the emulator.
#
# welcome → create an account → Home → the Study tab → a first deck → the
# account → Settings → delete the account (which signs out) → welcome again.
# Every tap is on the label a screen reader hears, so the flow reads the way
# the app is described, and it breaks when a string a user depends on changes.
#
# Runs against the API the dev client is pointed at (mobile/.env). That API
# keeps the beta gate on, so pass an invite: `-e INVITE=<code>`. The account
# it makes is deleted at the end; the suffix keeps the run idempotent.
appId: com.nowry.app
# Parameters, all from the command line (`-e NAME=value`): a default written
# here would shadow the value passed in, so none is.
#   INVITE      the beta invite code the dev API expects
#   DEV_SERVER  a development build runs its JS from Metro: the server as the
#               emulator reaches it, URL-encoded; leave it out for a production APK
env:
  PASSWORD: "Str0ng-enough!"
---
- launchApp
- runFlow:
    when:
      true: "${typeof DEV_SERVER !== 'undefined' && DEV_SERVER.length > 0}"
    commands:
      - openLink: com.nowry.app://expo-development-client/?url=${DEV_SERVER}
# The app bar names the product on every screen, signed in or out: it is the
# sign that the bundle is up.
- extendedWaitUntil:
    visible: "Nowry"
    timeout: 120000
# A development build keeps the last session: if somebody is signed in, leave
# first. (The flow deletes its own account at the end, so a clean run never
# needs this.)
- runFlow:
    when:
      visible: "Profile"
    commands:
      - tapOn: "Profile"
      - tapOn: "Logout"
# The headline is one text node of three lines and Maestro's matcher does not
# cross a line break, so Welcome is recognised by its key.
- extendedWaitUntil:
    visible: "Create a free account"
    timeout: 30000
- tapOn: "Create a free account"

# ── create an account ───────────────────────────────────────────────────────
- evalScript: ${output.suffix = String(Date.now()).slice(-6)}
- runFlow:
    when:
      visible: "Invite code"
    commands:
      - tapOn: "Invite code"
      - inputText: "${typeof INVITE !== 'undefined' ? INVITE : ''}"
- tapOn: "Username"
- inputText: e2e_${output.suffix}
- tapOn: "Email"
- inputText: e2e-${output.suffix}@example.com
# The keyboard covers the lower fields; Maestro only sees what is on screen.
- hideKeyboard
- scrollUntilVisible:
    element: "Password"
    direction: DOWN
- tapOn: "Password"
- inputText: ${PASSWORD}
- hideKeyboard
- scrollUntilVisible:
    element: "Confirm Password"
    direction: DOWN
- tapOn: "Confirm Password"
- inputText: ${PASSWORD}
- hideKeyboard
- scrollUntilVisible:
    element: "Create account"
    direction: DOWN
# The consent row's label holds two links, so the tap goes to the box itself.
- tapOn:
    id: "register-consent-box"
- tapOn: "Create account"

# ── Home, then the first deck ───────────────────────────────────────────────
- extendedWaitUntil:
    visible: "Welcome back.*"
    timeout: 30000
- tapOn: "Study"
# The Study tab opens on the dashboard; the library is its second view.
- tapOn: "Library"
- tapOn: "Add"
- tapOn: "New Deck"
- tapOn: "Deck name"
- inputText: E2E Capitals
- hideKeyboard
- tapOn: "Create deck"
- assertVisible: "E2E Capitals"
# The create sheet closes on its Done key.
- tapOn: "Done"

# ── leave: the account, Settings, delete ───────────────────────────────────
- tapOn: "Profile"
- tapOn: "Settings"
- scrollUntilVisible:
    element: "Delete account"
    direction: DOWN
- tapOn: "Confirm your email address"
- inputText: e2e-${output.suffix}@example.com
- hideKeyboard
- tapOn: "Delete account"
- tapOn: "Delete permanently"
- extendedWaitUntil:
    visible: "Create a free account"
    timeout: 30000
