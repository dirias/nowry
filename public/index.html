<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/png" href="%PUBLIC_URL%/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b3e43" />
  <meta name="description" content="Nowry — study cards, books, planning and focus in one place." />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
  <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
  <!--
      crossorigin="use-credentials" makes the browser send cookies with the
      manifest request. Required on Vercel deployments that have Deployment
      Protection (SSO) enabled — without it the request is anonymous and gets
      redirected to vercel.com/sso-api, which fails CORS.
    -->
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" crossorigin="use-credentials" />
  <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
  <title>Nowry - AI Study Companion</title>
  <!--
      Inter — self-hosted, on the critical path.

      No Google Fonts link anywhere in this app: no third-party request, no
      render-blocking external stylesheet, and GDPR-clean for EU users.

      The @font-face is hand-written here rather than imported from
      @fontsource-variable/inter, because a JS-imported stylesheet is emitted
      with a content-hashed filename that this file cannot name in a preload —
      and Inter is on the first paint of every screen, so it must be preloaded.
      The .woff2 is copied into public/fonts/ from the fontsource package.

      Exactly ONE file: the latin variable-weight roman. No italic (synthesised
      obliques are acceptable at our usage), and no Literata — that one is lazy,
      imported by the reading surfaces themselves.

      `unicode-range` is deliberately omitted. We ship a ja locale, and normal
      per-glyph fallback is what should serve it: CJK simply misses in this file
      and resolves down the stack to the platform face.
    -->
  <link rel="preload" as="font" type="font/woff2" crossorigin href="%PUBLIC_URL%/fonts/inter-latin-wght-normal.woff2" />
  <!--
      The display face (DS-007B). Preloaded for the same reason Inter is: it sets
      every page title, which is above the fold on every screen, so letting it
      arrive late means a visible reflow on the first thing a learner reads.

      The `wght` cut, not `opsz`: Bricolage ships an optical-size axis we do not
      drive, and the weight-axis file is the smaller of the two. 41 KB — slightly
      less than Inter's 48 KB, and the only other face on the critical path.

      `unicode-range` is dropped here as it is for Inter, for the same reason:
      per-glyph fallback should serve ja, not an empty range.
    -->
  <link rel="preload" as="font" type="font/woff2" crossorigin href="%PUBLIC_URL%/fonts/bricolage-grotesque-latin-wght-normal.woff2" />
  <style>
    @font-face {
      font-family: 'Inter Variable';
      font-style: normal;
      font-display: swap;
      font-weight: 100 900;
      src: url('/fonts/inter-latin-wght-normal.woff2') format('woff2-variations');
    }

    @font-face {
      font-family: 'Bricolage Grotesque Variable';
      font-style: normal;
      font-display: swap;
      font-weight: 200 800;
      src: url('/fonts/bricolage-grotesque-latin-wght-normal.woff2') format('woff2-variations');
    }
  </style>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
