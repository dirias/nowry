# Frontend Deploy — Nowry React App
#
# Triggers on push and pull request to main and dev. Runs validation (lint,
# build, every test suite) before Vercel's GitHub integration deploys.
#
# Every test step blocks (QA-001, ADR-049). Vercel deploys through its own
# GitHub integration, so a red run stops production only when Vercel waits for
# checks or branch protection on `main` requires these jobs: both are settings
# outside this file.
#
# Required GitHub Secrets (Settings → Secrets and Variables → Actions):
#   REACT_APP_SENTRY_DSN  — Sentry frontend DSN (from Sentry project settings)
#   VERCEL_TOKEN          — Vercel API token (only needed if NOT using Vercel GitHub integration)
#
# Deployment note: If Vercel GitHub integration is configured (recommended),
# Vercel auto-deploys when this workflow completes — no additional step needed.
# If not configured, uncomment the deploy job below and set VERCEL_TOKEN secret.

name: Frontend Deploy

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    name: Validate & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # This repository is an npm workspace root (ADR-032): the web client, the
        # shared package and the mobile client all live here. This job only builds
        # the web client, so it installs the root package and @nowry/core and skips
        # the mobile workspace, which pulls in React Native and Expo.
        run: npm ci --workspace=@nowry/core --include-workspace-root

      - name: Lint
        run: npm run lint
        continue-on-error: true  # Lint warnings do not block deployment

      # The @nowry/core boundary is not a style preference: JSX or a browser
      # global in that package breaks the WEB build with a confusing error
      # pointing at a file the web app does not own (ADR-026, ADR-031). It has
      # already caught two real bugs, so unlike the lint above it blocks.
      - name: Shared package boundary
        run: npx eslint "packages/core/**/*.js"

      - name: Shared package tests
        run: npm run test:core

      - name: Build
        run: npm run build
        env:
          REACT_APP_SENTRY_DSN: ${{ secrets.REACT_APP_SENTRY_DSN }}
          REACT_APP_ENVIRONMENT: production
          # CI=false prevents react-scripts from treating warnings as errors
          CI: false

      - name: Web tests
        run: npm test -- --watchAll=false
        env:
          CI: true

  mobile:
    name: Mobile unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # The mobile suite needs the mobile workspace and @nowry/core, which the
      # web job skips. It runs in Node only (see mobile/jest.config.js).
      - name: Install dependencies
        run: npm ci --workspace=nowry-mobile --workspace=@nowry/core --include-workspace-root

      - name: Mobile tests
        run: npm test --workspace=nowry-mobile

  # Vercel deployment is automatic via GitHub integration.
  # Uncomment this job only if Vercel GitHub integration is NOT configured:
  # deploy:
  #   name: Deploy to Vercel
  #   needs: build
  #   runs-on: ubuntu-latest
  #   environment: production
  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v4
  #
  #     - name: Deploy to Vercel (production)
  #       uses: amondnet/vercel-action@v25
  #       with:
  #         vercel-token: ${{ secrets.VERCEL_TOKEN }}
  #         vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
  #         vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
  #         vercel-args: '--prod'
